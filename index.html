<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HORAS | VICI / IURY</title>
  <link rel="icon" href="./vici_favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./vici_favicon.png">
  <link rel="apple-touch-icon" href="./vici_favicon_180.png">
  <script src="./hours_data.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg:
        radial-gradient(ellipse 80% 60% at 10% 8%, rgba(138,61,237,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 90% 88%, rgba(4,0,230,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 52% 42%, rgba(4,0,230,0.05) 0%, transparent 60%),
        linear-gradient(160deg, #f4f6fc 0%, #eef2fb 58%, #f3f5fc 100%);
      --panel: rgba(255, 255, 255, 0.58);
      --panel-strong: rgba(255, 255, 255, 0.78);
      --line: rgba(20, 24, 40, 0.1);
      --line-soft: rgba(16, 19, 26, 0.08);
      --text: #121826;
      --muted: rgba(18, 24, 38, 0.58);
      --accent: #0400e6;
      --green: #8a3ded;
      --red: #ff3b30;
      --orange: #ff9f0a;
      --blue-soft: rgba(4, 0, 230, 0.1);
      --lilac-soft: rgba(233, 229, 252, 0.92);
      --rose-soft: rgba(247, 229, 233, 0.92);
      --mint-soft: rgba(229,244,217,0.88);
      --peach-soft: rgba(255, 236, 214, 0.92);
      --radius-xl: 14px;
      --radius-lg: 12px;
      --radius-md: 10px;
      --shadow: 0 18px 50px rgba(60, 80, 130, 0.14);
      --inner: inset 0 1px 0 rgba(255,255,255,0.75);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      color: var(--text);
      background: var(--bg);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(255,255,255,0.24), transparent 48%);
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(20,24,40,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,24,40,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    button, select { font: inherit; }

    .app {
      position: relative;
      z-index: 1;
      width: min(100% - 22px, 1500px);
      height: calc(100vh - 24px);
      margin: 12px auto;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 14px;
    }

    .glass {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(145deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.7) 100%);
      border: 0.5px solid var(--line);
      border-radius: var(--radius-xl);
      clip-path: inset(0 round var(--radius-xl));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent 45%);
      opacity: 0.4;
    }

    .sidebar {
      min-height: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      padding: 12px 8px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .eyebrow {
      margin: 0 0 9px;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      width: 100%;
      text-align: justify;
      text-align-last: justify;
    }

    .eyebrow::after {
      content: "";
      display: inline-block;
      width: 100%;
    }

    .current-month-btn {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(4,0,230,0.26);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.58), rgba(255,255,255,0.22)),
        linear-gradient(120deg, rgba(4,0,230,0.08), rgba(255,255,255,0.06));
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.82),
        inset 0 -1px 0 rgba(4,0,230,0.1),
        0 0 0 1px rgba(255,255,255,0.34),
        0 16px 36px rgba(93,113,151,0.09);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .current-month-btn:hover {
      border-color: rgba(91,173,255,0.5);
      background:
        linear-gradient(180deg, rgba(246,251,255,0.68), rgba(255,255,255,0.3)),
        linear-gradient(120deg, rgba(4,0,230,0.1), rgba(138,61,237,0.04));
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 4rem);
      line-height: 0.98;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 720px;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .nav {
      display: grid;
      gap: 7px;
      min-height: 0;
      overflow: auto;
    }

    .month-btn {
      width: 100%;
      min-height: 42px;
      border: 0.5px solid rgba(20,24,40,0.12);
      border-radius: 10px;
      background: #ffffff;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 0 12px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,80,130,0.05);
    }

    .month-btn:nth-child(even) {
      background: #ffffff;
    }

    .month-btn:hover {
      background: rgba(138,61,237,0.12);
      border-color: rgba(138,61,237,0.4);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .month-btn.is-active {
      background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%);
      border-color: rgba(4,0,230,0.5);
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(4,0,230,0.28);
    }

    .month-btn.is-active .month-pill {
      background: rgba(255,255,255,0.24);
      color: #ffffff;
    }

    .month-pill {
      min-width: 54px;
      padding: 4px 8px;
      border-radius: 999px;
      text-align: center;
      background: rgba(20,24,40,0.08);
      color: #1a1d29;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .month-btn strong {
      flex: 1;
      text-align: left;
    }

    .month-check-toggle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(20,24,40,0.18);
      background: transparent;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 0.64rem;
      color: transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .month-btn.is-checked .month-check-toggle {
      background: transparent;
      border-color: rgba(138,61,237,0.55);
      color: #8a3ded;
      box-shadow: none;
    }

    .month-btn.is-checked {
      background: #ffffff;
      border-color: rgba(138,61,237,0.35);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(60,80,130,0.05);
    }

    .month-btn.is-checked .month-pill {
      background: rgba(20,24,40,0.08);
      color: #1a1d29;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .days-pill {
      min-width: 64px;
      padding: 5px 10px;
      border-radius: 999px;
      text-align: center;
      background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .sidebar-metric {
      margin-top: auto;
      display: grid;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }

    .tiny-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.6);
      border: 0.5px solid rgba(20,24,40,0.08);
    }

    .tiny-stat span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .tiny-stat strong {
      font-size: 0.96rem;
      color: #0400e6;
    }

    main {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 14px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .hero {
      padding: 16px 24px;
      min-height: 96px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      align-items: center;
      gap: 20px;
    }

    .title-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .hero-logo {
      width: clamp(58px, 5.4vw, 82px);
      height: clamp(58px, 5.4vw, 82px);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #000000;
      border: 0.5px solid rgba(20,24,40,0.18);
      box-shadow: 0 10px 26px rgba(60,80,130,0.18);
    }

    .hero-logo img {
      width: 58%;
      height: 58%;
      object-fit: contain;
      display: block;
      filter: grayscale(1) contrast(6) invert(1);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      justify-items: stretch;
    }

    .select-shell {
      padding: 0;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.56), rgba(255,255,255,0.24)),
        linear-gradient(120deg, rgba(4,0,230,0.055), rgba(138,61,237,0.035));
      border: 1px solid rgba(4,0,230,0.26);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.82),
        inset 0 -1px 0 rgba(4,0,230,0.1),
        0 0 0 1px rgba(255,255,255,0.34),
        0 16px 36px rgba(93,113,151,0.09);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      position: relative;
    }

    .select-shell::after {
      content: "";
      position: absolute;
      right: 22px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--text);
      border-bottom: 1.5px solid var(--text);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
      opacity: 0.62;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    select {
      width: 100%;
      min-height: 50px;
      border: 1px solid transparent;
      border-radius: 18px;
      padding: 0 46px 0 16px;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .status-chip {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 0 14px;
      background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%);
      border: 0.5px solid rgba(255,255,255,0.3);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(4,0,230,0.28);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .status-chip.negative {
      background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%);
      border-color: rgba(255,255,255,0.3);
      color: #ffffff;
    }

    .status-chip.positive {
      background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%);
      border-color: rgba(255,255,255,0.3);
      color: #ffffff;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .kpi {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      min-height: 154px;
      padding: 20px;
      border-radius: var(--radius-lg);
      clip-path: inset(0 round var(--radius-lg));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.72);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi:nth-child(1) { background: linear-gradient(160deg, #2b53ff 0%, #0400e6 100%); color: #ffffff; }
    .kpi:nth-child(2) { background: linear-gradient(160deg, #23262f 0%, #15161d 100%); color: #ffffff; }
    .kpi:nth-child(3) { background: linear-gradient(160deg, #ffffff 0%, #eef1f8 100%); color: #000000; }
    .kpi:nth-child(4) { background: linear-gradient(160deg, #9a52f0 0%, #6a1fd0 100%); color: #ffffff; }

    .kpi span {
      color: currentColor;
      opacity: 0.72;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .kpi strong {
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1;
    }

    .kpi small {
      color: currentColor;
      opacity: 0.7;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
      min-height: 0;
    }

    .panel {
      padding: 18px;
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title .search-panel {
      margin-left: auto;
      margin-right: 8px;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-left: auto;
      min-width: 0;
    }

    .panel-tool {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0.5px solid rgba(20,24,40,0.12);
      background: #ffffff;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,80,130,0.05);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    .panel-tool:hover,
    .panel-tool.is-active {
      color: var(--accent);
      border-color: rgba(4,0,230,0.3);
      background: rgba(4,0,230,0.06);
    }

    .panel-tool.is-active {
      box-shadow: 0 0 0 1px rgba(4,0,230,0.12);
    }

    h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: 0;
    }

    .panel-title span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .panel-title .days-pill {
      color: #ffffff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 280px;
    }

    .timeline {
      display: grid;
      gap: 3px;
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow: auto;
      padding: 0 4px 12px 0;
      scroll-behavior: auto;
      overscroll-behavior: auto;
      scrollbar-gutter: stable;
    }

    .entry {
      display: grid;
      grid-template-columns: 58px 112px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 4px 10px;
      border-radius: 9px;
      background: #ffffff;
      border: 0.5px solid rgba(20,24,40,0.08);
    }

    .entry.is-today {
      margin-bottom: 12px;
      min-height: 48px;
      background: linear-gradient(180deg, #ffffff, rgba(4,0,230,0.06));
      border-color: rgba(4,0,230,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.78), 0 8px 20px rgba(60,80,130,0.08);
    }

    .entry:nth-child(even) {
      background: rgba(20,24,40,0.03);
    }

    .entry:nth-child(odd):not(.header) {
      background: #ffffff;
    }

    .entry.header {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 34px;
      background: rgba(255,255,255,0.82);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .entry-day {
      display: grid;
      place-items: center;
      min-height: 38px;
      border-radius: 9px;
      background: rgba(20,24,40,0.05);
      color: #000000;
      font-weight: 800;
      text-align: center;
      font-size: 0.9rem;
    }

    .entry-hours {
      font-weight: 800;
      text-align: center;
      color: var(--text);
    }

    .hours-stepper {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 4px;
      min-height: 32px;
    }

    .hour-step {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(4,0,230,0.12);
      border-radius: 9px;
      background: rgba(255,255,255,0.18);
      color: var(--accent);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      box-shadow: none;
      opacity: 0.78;
    }

    .hour-step:hover {
      background: rgba(4,0,230,0.08);
      border-color: rgba(4,0,230,0.22);
      opacity: 1;
    }

    .hour-value {
      min-width: 0;
      text-align: center;
      font-weight: 900;
      color: var(--text);
    }

    .entry-task {
      min-width: 0;
      color: var(--text);
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .entry-task.is-empty {
      color: var(--muted);
    }

    .entry-input {
      width: 100%;
      min-height: 32px;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 0 10px;
      background: rgba(255,255,255,0.32);
      color: var(--text);
      font: inherit;
      font-size: 0.92rem;
      outline: none;
      box-shadow: none;
    }

    .entry-input.hours {
      text-align: center;
      font-weight: 800;
    }

    .day-picker {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 32px;
      border-radius: 8px;
      color: #000000;
      background: rgba(20,24,40,0.05);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .day-picker:hover {
      background: rgba(20,24,40,0.1);
      box-shadow: inset 0 0 0 1px rgba(20,24,40,0.15);
    }

    .day-date-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: 0;
    }

    .day-date-input::-webkit-calendar-picker-indicator {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .entry:nth-child(even) .entry-input {
      background: rgba(255,255,255,0.22);
    }

    .entry:nth-child(even) .day-picker {
      background: rgba(20,24,40,0.07);
    }

    .entry.is-today .day-picker {
      background: rgba(4,0,230,0.12);
      color: #0400e6;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.76rem;
      font-weight: 800;
      border: 0.5px solid rgba(4,0,230,0.3);
    }

    .today-label {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
    }

    .today-label small {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0;
      opacity: 0.72;
    }

    .entry-input:focus {
      border-color: rgba(4,0,230,0.42);
      box-shadow: 0 0 0 4px rgba(4,0,230,0.1), inset 0 1px 0 rgba(255,255,255,0.72);
    }

    .tag-editor {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      min-height: 32px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tag-editor::-webkit-scrollbar { display: none; }

    .activity-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.22));
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      border: 1px solid rgba(4,0,230,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }

    .tag-remove,
    .tag-add {
      border: 1px solid rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.56);
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }

    .tag-remove {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      line-height: 1;
      display: grid;
      place-items: center;
      padding: 0;
      background: rgba(255,255,255,0.42);
      border-color: rgba(4,0,230,0.12);

    .tag-add {
      min-width: 32px;
      min-height: 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
    }

    .tag-input {
      flex: 1 1 180px;
      min-width: 140px;
    }

    .search-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(100%, 280px);
      flex: 0 1 280px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.6);
      border: 0.5px solid rgba(20,24,40,0.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    .search-panel::before {
      content: "";
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      background: #8a3ded;
      -webkit-mask: url("./search_icon.png") center / contain no-repeat;
      mask: url("./search_icon.png") center / contain no-repeat;
      opacity: 1;
    }

    .search-panel .entry-input {
      min-height: 40px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      box-shadow: none;
    }

    .search-panel .entry-input::placeholder {
      color: rgba(18,24,38,0.52);
      opacity: 1;
    }

    .search-panel .entry-input:focus {
      box-shadow: none;
    }

    .search-results {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 0;
      margin-bottom: 10px;
    }

    .search-results:empty {
      display: none;
    }

    .search-result {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(4,0,230,0.08);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.66);
    }

    .search-empty {
      display: none;
    }

    .summary {
      display: none;
    }

    .summary-item {
      min-height: 92px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.52);
      border: 1px solid rgba(255,255,255,0.64);
      display: grid;
      align-content: space-between;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .summary-item strong {
      font-size: 1.35rem;
    }

    .heavy-day {
      padding: 18px;
    }

    .heavy-day .entry {
      margin-top: 12px;
    }

    .positive { color: inherit; }
    .negative { color: inherit; }

    @media (max-width: 1080px) {
      body { overflow: auto; }
      .app { height: auto; margin-bottom: 24px; }
      .app { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; height: auto; }
      .nav { overflow: visible; }
      .sidebar-metric { margin-top: 0; }
      main { grid-template-rows: none; overflow: visible; }
      .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .month-btn { padding: 0 8px; }
      .hero { grid-template-columns: 1fr; }
      .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .grid { grid-template-columns: 1fr; }
      .panel { height: auto; display: block; }
      .timeline { max-height: 720px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      :root {
        --bg:
          radial-gradient(circle at 10% 4%, rgba(4,0,230,0.09), transparent 26%),
          radial-gradient(circle at 92% 10%, rgba(138,61,237,0.09), transparent 24%),
          linear-gradient(180deg, #f5f8fc 0%, #fbfdff 58%, #f3f6fa 100%);
        --accent: #2f80ed;
        --shadow: 0 14px 36px rgba(93, 113, 151, 0.11);
        --radius-xl: 18px;
      }

      body { background: var(--bg); }

      body::before { opacity: 0.42; }
      .app { width: min(100% - 18px, 1500px); margin-top: 8px; gap: 10px; }
      .glass { border-radius: 18px; clip-path: inset(0 round 18px); }
      .hero, .panel, .sidebar, .heavy-day { padding: 12px; border-radius: 18px; }
      .sidebar { gap: 10px; }
      .brand { padding: 8px 6px 12px; }
      .eyebrow { font-size: 0.62rem; margin-bottom: 8px; }
      .current-month-btn { min-height: 36px; font-size: 0.74rem; border-radius: 14px; }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .month-btn { min-height: 34px; border-radius: 11px; padding: 0 9px; font-size: 0.82rem; }
      .month-pill { min-width: 46px; padding: 3px 7px; font-size: 0.72rem; }
      .sidebar-metric { gap: 6px; padding-top: 10px; }
      .tiny-stat { min-height: 34px; padding: 7px 10px; border-radius: 12px; }
      .tiny-stat span { font-size: 0.74rem; }
      .tiny-stat strong { font-size: 0.86rem; }
      .controls { grid-template-columns: 1fr; }
      .hero { min-height: auto; gap: 12px; }
      .title-lockup { gap: 10px; }
      .hero-logo { width: 46px; height: 46px; border-radius: 12px; }
      h1 { font-size: 1.95rem; line-height: 1; }
      select, .status-chip { min-height: 42px; border-radius: 14px; font-size: 0.82rem; }
      .kpis { grid-template-columns: 1fr; }
      .kpi { min-height: 104px; padding: 14px; border-radius: 16px; }
      .kpi span { font-size: 0.7rem; }
      .kpi strong { font-size: 2rem; }
      .kpi small { font-size: 0.78rem; }
      .panel-title { margin-bottom: 10px; align-items: flex-start; }
      .panel-title .search-panel { margin-left: 0; margin-right: 0; }
      .panel-title { flex-wrap: wrap; }
      .panel-actions { width: 100%; margin-left: 0; gap: 6px; flex-wrap: wrap; }
      .panel-tool { min-height: 34px; padding: 0 10px; font-size: 0.74rem; }
      h2 { font-size: 0.95rem; }
      .entry { grid-template-columns: 50px 98px minmax(0, 1fr); }
      .timeline { max-height: 560px; gap: 2px; }
      .entry { min-height: 38px; padding: 3px 7px; border-radius: 9px; gap: 7px; }

      .activity-tag { min-height: 24px; padding: 0 7px; font-size: 0.76rem; }

      .tag-add { min-width: 28px; min-height: 28px; border-radius: 9px; font-size: 0.86rem; }
      .tag-input { min-width: 100%; }
      .search-panel { width: 100%; min-height: 34px; padding: 0 10px; }
    }

    /* Modo só-leitura (clientes): esconde controles de edição. */
    body.view-only #addDayBtn,
    body.view-only .hours-stepper .hour-step,
    body.view-only .day-date-input,
    body.view-only .tag-add,
    body.view-only .tag-remove,
    body.view-only .tag-input { display: none !important; }
    body.view-only .day-picker { cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar glass">
      <div class="brand">
        <p class="eyebrow">Iury / VICI</p>
      </div>
      <nav class="nav" id="monthNav" aria-label="Meses"></nav>
      <div class="sidebar-metric">
        <div class="tiny-stat"><span>Total registrado</span><strong id="sideTotal">0h</strong></div>
        <div class="tiny-stat"><span>Dias lançados</span><strong id="sideDays">0</strong></div>
        <div class="tiny-stat"><span>Saldo final</span><strong id="sideBalance">0h</strong></div>
      </div>
    </aside>

    <main>
      <section class="hero glass">
        <div class="title-lockup">
          <span class="hero-logo" aria-hidden="true">
            <img src="./vici_favicon_512.png" alt="">
          </span>
          <h1>controle de horas</h1>
        </div>
        <div class="controls">
          <div class="select-shell">
            <select id="monthSelect"></select>
          </div>
          <div class="status-chip" id="statusChip">Carregando</div>
        </div>
      </section>

      <section class="kpis" aria-label="Indicadores do mês">
        <article class="kpi"><span>Horas realizadas</span><strong id="kpiHours">0h</strong><small id="kpiHoursNote">total do mês</small></article>
        <article class="kpi"><span>Meta ajustada</span><strong id="kpiTarget">0h</strong><small>80h + saldo anterior</small></article>
        <article class="kpi"><span>Saldo final</span><strong id="kpiBalance">0h</strong><small id="kpiBalanceNote">impacta o próximo mês</small></article>
        <article class="kpi"><span>Cumprimento</span><strong id="kpiCompletion">0%</strong><small id="kpiCompletionNote">progresso sobre a meta ajustada</small></article>
      </section>

      <section class="grid">
        <article class="panel glass">
          <div class="panel-title">
            <div class="panel-heading">
              <h2>Tarefas do mês</h2>
              <span class="days-pill" id="monthDaysPill">0 dias</span>
            </div>
            <div class="panel-actions">
              <button class="panel-tool" id="addDayBtn" type="button">+ Dia</button>
              <button class="panel-tool" id="pendingToggle" type="button">Pendentes</button>
              <button class="panel-tool" id="exportMonthBtn" type="button">Relatório</button>
              <div class="search-panel">
                <input class="entry-input" id="activitySearch" type="search" placeholder="Buscar">
              </div>
            </div>
          </div>
          <div class="search-results" id="activitySearchResults"></div>
          <div class="timeline" id="timeline"></div>
          <datalist id="tagSuggestions"></datalist>
        </article>

      </section>

      <section class="heavy-day glass">
        <div class="panel-title">
          <h2>Dia mais pesado</h2>
        </div>
        <div class="entry" id="maxDayCard"></div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "hours-dashboard-edits-v5";
    const MIGRATION_KEY = "hours-dashboard-fill-4h-v1";
    const ZERO_ABSENCE_KEY = "hours-dashboard-zero-absence-v1";
    const GRAMMAR_MIGRATION_KEY = "hours-dashboard-grammar-v1";
    const CHECKED_KEY = "hours-dashboard-vici-checked-v1";
    const CLOUD_ENDPOINT = "https://horas-backup.iury.workers.dev";
    const CLOUD_STORE = "vici";
    const EDIT_TOKEN = (location.hash.match(/(?:^#|&)edit=([0-9a-fA-F]+)/) || [])[1] || "";
    const EDIT_MODE = EDIT_TOKEN.length > 0;
    if (!EDIT_MODE && document.body) document.body.classList.add("view-only");
    const TASK_CORRECTIONS = new Map([
      ["Edição video ISO e inicio de tratamento de fotos Eccelenza 2026", "Edição vídeo ISO e início de tratamento de fotos Eccellenza 2026"],
      ["Finalização video Fitwell", "Finalização vídeo Fitwell"],
      ["Continuação diagramação codigo de ética VICI", "Continuação da diagramação código de ética VICI"],
      ["Finalização codigo de ética", "Finalização do código de ética"],
      ["Alteração codigo de ética", "Alteração do código de ética"],
      ["Alteração arte premiaçòes", "Alteração da arte de premiações"],
      ["Captação e começo de edição acompanhamento Gioppo", "Captação e início da edição do acompanhamento Gioppo"],
      ["Começo arte mestre", "Início da arte master"],
      ["Captação corretor Pedro + Barra Blue", "Captação do corretor Pedro + Barra Blue"],
      ["Alteração.e finalização vídeo Pedro", "Alteração e finalização vídeo Pedro"],
      ["Foto perfis", "Fotos de perfil"],
      ["Fotos perfil", "Fotos de perfil"],
      ["Organização drive", "Organização do Drive"],
      ["Organização drive comercial", "Organização do Drive comercial"],
      ["Começo da marca Tropea", "Início da marca Tropea"],
      ["Finalização arte sacola", "Finalização da arte da sacola"],
      ["Edição book corretores", "Edição do book de corretores"],
      ["Ajuste apresentação Tropea", "Ajuste da apresentação Tropea"],
      ["Arte dia do trabalhador", "Arte Dia do Trabalhador"],
      ["Arte dia das mães", "Arte Dia das Mães"],
      ["Arte caixa medicamento", "Arte caixa de medicamento"],
      ["Drones acompanhamento", "Drones de acompanhamento"],
      ["Fotos drone Lucas", "Fotos de drone Lucas"],
      ["Edição e finalização acompanhamento Gioppo", "Edição e finalização do acompanhamento Gioppo"],
      ["Decupagem acompanhamento Positano", "Decupagem do acompanhamento Positano"],
      ["Ajustes ilustrações Bobie", "Ajustes nas ilustrações Bobie"],
      ["Marca tropea e apresentação da marca", "Marca Tropea e apresentação da marca"],
      ["Analise site Vici", "Análise do site VICI"],
      ["Finalizaçào video do Lucas", "Finalização vídeo do Lucas"],
      ["Finalização video do Lucas", "Finalização vídeo do Lucas"],
      ["Finalização video esgoto Chico", "Finalização do vídeo de esgoto Chico"],
      ["Captação acompoanhamento Gioppo e Positano", "Captação do acompanhamento Gioppo e Positano"],
      ["Captação Pedro Transatlantico", "Captação Pedro Transatlântico"],
      ["Fotos terrenos Lucas", "Fotos dos terrenos Lucas"],
      ["Tratamento fotos Terreno", "Tratamento de fotos do terreno"],
      ["Começo da edição Positano", "Início da edição Positano"],
      ["Finalização livro de colorir", "Finalização do livro de colorir"],
      ["Reunião apresentação Tropea", "Reunião de apresentação Tropea"],
      ["4.5", ""],
      ["off", "Off"],
    ]);
    const data = loadData();
    const months = data.months;
    const MONTH_NAMES = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
    const MONTH_NUMBERS = { "MARÇO": 3, "ABRIL": 4, "MAIO": 5, "JUNHO": 6, "JULHO": 7, "AGOSTO": 8, "SETEMBRO": 9, "OUTUBRO": 10, "NOVEMBRO": 11, "DEZEMBRO": 12 };
    const YEAR = 2026;
    let cloudSaveTimer = null;
    let selectedIndex = getCurrentMonthIndex();
    let showOnlyPending = false;
    let checkedMonths = new Set(JSON.parse(localStorage.getItem(CHECKED_KEY) || "[]"));

    const fmtHours = (value) => value === null || value === undefined ? "—" : `${Number(value || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}h`;
    const fmtPct = (value) => `${Math.round((value || 0) * 100)}%`;
    const fmtBalance = (value) => {
      if (value === null || value === undefined) return "—";
      if (value < 0) return `+${fmtHours(Math.abs(value))}`;
      return fmtHours(value);
    };

    function balanceClass(value) {
      if (value < 0) return "positive";
      if (value > 0) return "negative";
      return "";
    }

    function statusText(month) {
      if (!month.isActive) return "Mês sem lançamentos reais";
      if (month.balance < 0) return `Horas a mais: ${fmtHours(Math.abs(month.balance))}`;
      if (month.balance > 0) return `Faltam: ${fmtHours(month.balance)}`;
      return "Meta fechada";
    }

    function getCurrentMonthIndex() {
      const currentMonthName = MONTH_NAMES[new Date().getMonth()];
      const index = months.findIndex((month) => month.name === currentMonthName);
      return index >= 0 ? index : 0;
    }

    function statusClass(month) {
      if (!month.isActive || month.balance === 0) return "";
      return month.balance < 0 ? "positive" : "negative";
    }

    function loadData() {
      const base = JSON.parse(JSON.stringify(window.HOURS_DASHBOARD_DATA));
      normalizeAllEntries(base);
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || !Array.isArray(saved.months)) return base;
        saved.months.forEach((savedMonth) => {
          const month = base.months.find((item) => item.name === savedMonth.name);
          if (month && Array.isArray(savedMonth.entries)) {
            month.entries = savedMonth.entries;
          }
        });
      } catch (error) {
        return base;
      }
      normalizeAllEntries(base);
      applyGrammarCorrections(base);
      recalculateAll(base);
      return base;
    }

    function normalizeAllEntries(targetData = data) {
      targetData.months.forEach((month) => {
        month.entries.forEach(normalizeEntryTags);
      });
    }

    function normalizeEntryTags(entry) {
      if (!Array.isArray(entry.tags)) {
        entry.tags = String(entry.task || "")
          .split("/")
          .map((tag) => tag.trim())
          .filter(Boolean);
      }
      entry.task = entry.tags.join(" / ");
      return entry;
    }

    function applyGrammarCorrections(targetData = data) {
      let changed = false;
      targetData.months.forEach((month) => {
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          const correctedTags = entry.tags
            .map((tag) => TASK_CORRECTIONS.has(tag) ? TASK_CORRECTIONS.get(tag) : tag)
            .filter(Boolean);
          if (correctedTags.join(" / ") !== entry.tags.join(" / ")) {
            entry.tags = correctedTags;
            entry.task = correctedTags.join(" / ");
            changed = true;
          }
        });
      });
      return changed;
    }

    function fillFutureZeroHours(targetData = data) {
      const monthsToFill = new Set(["MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"]);
      let changed = false;
      targetData.months.forEach((month) => {
        if (!monthsToFill.has(month.name)) return;
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          if (Number(entry.hours || 0) === 0 && !isExcludedTask(activityText(entry))) {
            entry.hours = 4;
            changed = true;
          }
        });
      });
      if (changed) {
        normalizeAllEntries(targetData);
        recalculateAll(targetData);
      }
      return changed;
    }

    function zeroAbsenceHours(targetData = data) {
      let changed = false;
      targetData.months.forEach((month) => {
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          if (isZeroHourAbsence(activityText(entry)) && Number(entry.hours || 0) !== 0) {
            entry.hours = 0;
            changed = true;
          }
        });
      });
      if (changed) {
        normalizeAllEntries(targetData);
        recalculateAll(targetData);
      }
      return changed;
    }

    function saveChecked() {
      localStorage.setItem(CHECKED_KEY, JSON.stringify([...checkedMonths]));
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        months: months.map((month) => ({
          name: month.name,
          entries: month.entries,
        })),
      }));
      queueCloudSave();
    }

    function serializeData() {
      recalculateAll();
      return {
        generatedAt: data.generatedAt,
        client: data.client,
        owner: data.owner,
        monthlyTarget: data.monthlyTarget,
        totals: data.totals,
        months: months.map((month) => ({
          name: month.name,
          target: month.target,
          previousBalance: month.previousBalance,
          adjustedTarget: month.adjustedTarget,
          totalHours: month.totalHours,
          balance: month.balance,
          completion: month.completion,
          workedDays: month.workedDays,
          avgPerWorkedDay: month.avgPerWorkedDay,
          taskDays: month.taskDays,
          entries: month.entries.map((entry) => ({
            day: entry.day,
            dayNumber: entry.dayNumber,
            hours: Number(entry.hours || 0),
            task: activityText(entry),
            tags: Array.isArray(entry.tags) ? entry.tags : [],
          })),
        })),
      };
    }

    function queueCloudSave() {
      window.clearTimeout(cloudSaveTimer);
      cloudSaveTimer = window.setTimeout(saveCloudData, 450);
    }

    function saveCloudData() {
      if (!CLOUD_ENDPOINT) return;
      const payload = JSON.stringify({ action: "write", store: CLOUD_STORE, token: EDIT_TOKEN, data: serializeData() });
      fetch(CLOUD_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        body: payload,
      }).catch((error) => {
        console.warn("Não foi possível salvar no Google Sheets agora.", error);
      });
    }

    function loadCloudData() {
      if (!CLOUD_ENDPOINT) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const callbackName = `hoursDashboardCloud_${Date.now()}_${Math.round(Math.random() * 100000)}`;
        const script = document.createElement("script");
        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = (response) => {
          cleanup();
          resolve(response && response.data ? response.data : response);
        };

        script.src = `${CLOUD_ENDPOINT}?action=read&store=${CLOUD_STORE}&callback=${encodeURIComponent(callbackName)}&t=${Date.now()}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Falha ao carregar dados online."));
        };
        document.body.appendChild(script);
      });
    }

    function applyCloudData(remoteData) {
      if (!remoteData || !Array.isArray(remoteData.months)) return false;
      remoteData.months.forEach((remoteMonth) => {
        const month = months.find((item) => item.name === remoteMonth.name);
        if (month && Array.isArray(remoteMonth.entries)) {
          month.entries = remoteMonth.entries;
        }
      });
      normalizeAllEntries();
      const grammarChanged = localStorage.getItem(GRAMMAR_MIGRATION_KEY) !== "done" && applyGrammarCorrections();
      const filledFuture = localStorage.getItem(MIGRATION_KEY) !== "done" && fillFutureZeroHours();
      const zeroedAbsences = localStorage.getItem(ZERO_ABSENCE_KEY) !== "done" && zeroAbsenceHours();
      const migrated = grammarChanged || filledFuture || zeroedAbsences;
      recalculateAll();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        months: months.map((month) => ({
          name: month.name,
          entries: month.entries,
        })),
      }));
      if (migrated) {
        localStorage.setItem(GRAMMAR_MIGRATION_KEY, "done");
        localStorage.setItem(MIGRATION_KEY, "done");
        localStorage.setItem(ZERO_ABSENCE_KEY, "done");
        queueCloudSave();
      }
      return true;
    }

    function isExcludedTask(task) {
      return isZeroHourAbsence(task);
    }

    function isZeroHourAbsence(task) {
      return ["viagem", "ferias", "férias", "off"].includes(String(task || "").trim().toLowerCase());
    }

    function isActiveMonth(month) {
      return month.entries.length > 0;
    }

    function recalculateAll(targetData = data) {
      let runningBalance = 0;
      const activeMonths = [];

      targetData.months.forEach((month) => {
        const total = month.entries.reduce((sum, entry) => sum + Number(entry.hours || 0), 0);
        const worked = month.entries.filter((entry) => Number(entry.hours || 0) > 0);
        const active = isActiveMonth(month);
        const previousBalance = active ? runningBalance : null;
        const adjustedTarget = active ? 80 + previousBalance : null;
        const balance = active ? adjustedTarget - total : null;

        month.isActive = active;
        month.totalHours = Number(total.toFixed(2));
        month.previousBalance = previousBalance === null ? null : Number(previousBalance.toFixed(2));
        month.adjustedTarget = adjustedTarget === null ? null : Number(adjustedTarget.toFixed(2));
        month.balance = balance === null ? null : Number(balance.toFixed(2));
        month.completion = active && adjustedTarget ? Number((total / adjustedTarget).toFixed(4)) : 0;
        month.workedDays = worked.length;
        month.avgPerWorkedDay = worked.length ? Number((total / worked.length).toFixed(2)) : 0;
        month.entries.forEach(normalizeEntryTags);
        month.taskDays = month.entries.filter((entry) => entry.tags.length).length;
        month.maxDay = month.entries.reduce((max, entry) => Number(entry.hours || 0) > Number(max.hours || 0) ? entry : max, month.entries[0] || null);

        if (active) {
          runningBalance = month.balance;
          activeMonths.push(month);
        }
      });

      targetData.totals.months = activeMonths.length;
      targetData.totals.totalHours = Number(activeMonths.reduce((sum, month) => sum + month.totalHours, 0).toFixed(2));
      targetData.totals.targetHours = 80 * activeMonths.length;
      targetData.totals.workedDays = activeMonths.reduce((sum, month) => sum + month.workedDays, 0);
      targetData.totals.taskDays = activeMonths.reduce((sum, month) => sum + month.taskDays, 0);
      targetData.totals.finalBalance = activeMonths.length ? activeMonths[activeMonths.length - 1].balance : 0;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function activityText(entry) {
      normalizeEntryTags(entry);
      return entry.tags.join(" / ");
    }

    function dayToDateValue(monthName, day) {
      const monthNumber = MONTH_NUMBERS[monthName] || 1;
      const match = String(day || "").match(/\d+/);
      const dayNumber = match ? Number(match[0]) : 1;
      return `${YEAR}-${String(monthNumber).padStart(2, "0")}-${String(dayNumber).padStart(2, "0")}`;
    }

    function todayDayNumberForMonth(monthName) {
      const today = new Date();
      if (today.getFullYear() !== YEAR) return null;
      const currentMonthName = MONTH_NAMES[today.getMonth()];
      return currentMonthName === monthName ? today.getDate() : null;
    }

    function dateValueToDay(value) {
      const day = Number(String(value || "").split("-")[2]);
      return Number.isFinite(day) && day > 0 ? String(day) : "";
    }

    function fmtHourValue(value) {
      return Number(value || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
    }

    function initControls() {
      const nav = document.getElementById("monthNav");
      const select = document.getElementById("monthSelect");
      nav.innerHTML = "";
      select.innerHTML = "";
      months.forEach((month, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "month-btn";
        btn.innerHTML = `<span class="month-check-toggle" aria-label="Marcar mês como fechado">✓</span><strong>${month.name}</strong><span class="month-pill">${month.isActive ? fmtHours(month.totalHours) : "—"}</span>`;
        btn.addEventListener("click", (e) => {
          if (e.target.closest(".month-check-toggle")) {
            if (checkedMonths.has(month.name)) checkedMonths.delete(month.name);
            else checkedMonths.add(month.name);
            saveChecked();
            render();
            return;
          }
          selectMonth(index);
        });
        nav.appendChild(btn);

        const option = document.createElement("option");
        option.value = index;
        option.textContent = month.name;
        select.appendChild(option);
      });
      select.addEventListener("change", (event) => selectMonth(Number(event.target.value)));
      document.getElementById("activitySearch").addEventListener("input", renderSearchResults);
      document.getElementById("pendingToggle").addEventListener("click", () => {
        showOnlyPending = !showOnlyPending;
        render();
      });
      document.getElementById("exportMonthBtn").addEventListener("click", exportSelectedMonth);
      document.getElementById("addDayBtn").addEventListener("click", addEntry);
    }

    function selectMonth(index) {
      selectedIndex = index;
      render();
    }

    function render() {
      const month = months[selectedIndex];
      document.getElementById("monthSelect").value = selectedIndex;
      document.querySelectorAll(".month-btn").forEach((btn, index) => {
        btn.classList.toggle("is-active", index === selectedIndex);
        btn.classList.toggle("is-checked", checkedMonths.has(months[index].name));
        const pill = btn.querySelector(".month-pill");
        if (pill) pill.textContent = months[index].isActive ? fmtHours(months[index].totalHours) : "—";
      });

      const statusChip = document.getElementById("statusChip");
      statusChip.textContent = statusText(month);
      statusChip.className = `status-chip ${statusClass(month)}`;
      document.getElementById("kpiHours").textContent = fmtHours(month.totalHours);
      document.getElementById("kpiTarget").textContent = fmtHours(month.adjustedTarget);
      document.getElementById("kpiBalance").textContent = fmtBalance(month.balance);
      document.getElementById("kpiBalance").className = balanceClass(month.balance);
      document.getElementById("kpiCompletion").textContent = fmtPct(month.completion);
      document.getElementById("kpiHoursNote").textContent = `${month.workedDays} dias com horas | média ${fmtHours(month.avgPerWorkedDay)}`;
      document.getElementById("kpiBalanceNote").textContent = month.balance < 0 ? "crédito para o próximo mês" : "saldo a cumprir no próximo mês";
      document.getElementById("kpiCompletionNote").textContent = `${fmtHours(month.previousBalance)} de saldo anterior`;
      if (!month.isActive) {
        document.getElementById("kpiHoursNote").textContent = "sem trabalho real registrado";
        document.getElementById("kpiBalanceNote").textContent = "não entra no acumulado";
        document.getElementById("kpiCompletionNote").textContent = "aguardando lançamento";
      }

      document.getElementById("sideTotal").textContent = fmtHours(data.totals.totalHours);
      document.getElementById("sideDays").textContent = data.totals.workedDays;
      document.getElementById("sideBalance").textContent = fmtBalance(data.totals.finalBalance);
      document.getElementById("monthDaysPill").textContent = `${month.entries.length} dias`;
      document.getElementById("pendingToggle").classList.toggle("is-active", showOnlyPending);
      document.getElementById("pendingToggle").textContent = showOnlyPending ? "Todos" : "Pendentes";
      renderTagSuggestions();

      renderTimeline(month);
      renderSearchResults();
    }

    function renderTimeline(month) {
      const timeline = document.getElementById("timeline");
      const todayDayNumber = todayDayNumberForMonth(month.name);
      const entries = month.entries
        .map((entry, index) => ({ entry, index }))
        .filter(({ entry }) => !showOnlyPending || isPendingEntry(entry));
      const todayEntryIndex = entries.findIndex(({ entry }) => Number(entry.dayNumber) === todayDayNumber);
      const displayEntries = todayEntryIndex >= 0
        ? [entries[todayEntryIndex], ...entries.filter((_, index) => index !== todayEntryIndex)]
        : entries;
      const emptyMessage = showOnlyPending && displayEntries.length === 0
        ? `<div class="entry"><div></div><div></div><div class="entry-task is-empty">Nenhum dia pendente neste mês.</div></div>`
        : "";
      timeline.innerHTML = `
        <div class="entry header">
          <div>DIA</div>
          <div>HORAS</div>
          <div>ATIVIDADE</div>
        </div>
      ` + emptyMessage + displayEntries.map(({ entry, index }) => {
        const isToday = Number(entry.dayNumber) === todayDayNumber;
        return `
        <div class="entry ${isToday ? "is-today" : ""}">
          <div class="day-picker">
            <span>${isToday ? `<span class="today-label">Hoje <small>${escapeHtml(entry.day)}</small></span>` : escapeHtml(entry.day)}</span>
            <input class="day-date-input" data-index="${index}" data-field="day" type="date" value="${dayToDateValue(month.name, entry.day)}" aria-label="Dia">
          </div>
          <div class="hours-stepper" data-index="${index}">
            <button class="hour-step" type="button" data-index="${index}" data-direction="-1" aria-label="Diminuir horas">−</button>
            <div class="hour-value">${fmtHourValue(entry.hours)}</div>
            <button class="hour-step" type="button" data-index="${index}" data-direction="1" aria-label="Aumentar horas">+</button>
          </div>
          <div class="tag-editor" data-index="${index}">
            ${entry.tags.map((tag, tagIndex) => `
              <span class="activity-tag">${escapeHtml(tag)}<button class="tag-remove" type="button" data-index="${index}" data-tag-index="${tagIndex}" aria-label="Remover ${escapeHtml(tag)}">×</button></span>
            `).join("")}
            <input class="entry-input tag-input" data-index="${index}" list="tagSuggestions" placeholder="" aria-label="Adicionar atividade">
            <button class="tag-add" type="button" data-index="${index}" aria-label="Adicionar atividade">+</button>
          </div>
        </div>
      `;
      }).join("");
      timeline.querySelectorAll(".day-date-input").forEach((input) => {
        input.addEventListener("change", handleEntryEdit);
        input.addEventListener("click", handleDayPickerOpen);
      });
      timeline.querySelectorAll(".hour-step").forEach((button) => {
        button.addEventListener("click", handleHourStep);
      });
      timeline.querySelectorAll(".tag-input").forEach((input) => {
        input.addEventListener("keydown", handleTagKeydown);
      });
      timeline.querySelectorAll(".tag-add").forEach((button) => {
        button.addEventListener("click", handleTagAdd);
      });
      timeline.querySelectorAll(".tag-remove").forEach((button) => {
        button.addEventListener("click", handleTagRemove);
      });

      const max = month.maxDay || { day: "-", hours: 0, task: "" };
      document.getElementById("maxDayCard").innerHTML = `
        <div class="entry-day">${max.day}</div>
        <div class="entry-hours">${fmtHours(max.hours)}</div>
        <div class="entry-task ${activityText(max) ? "" : "is-empty"}">${activityText(max) || "Sem descrição registrada"}</div>
      `;
    }

    function handleEntryEdit(event) {
      const input = event.currentTarget;
      const month = months[selectedIndex];
      const entry = month.entries[Number(input.dataset.index)];
      const field = input.dataset.field;
      if (!entry) return;

      if (field === "hours") {
        entry.hours = Math.max(0, Number(input.value || 0));
      } else if (field === "day") {
        entry.day = dateValueToDay(input.value);
        entry.dayNumber = Number(entry.day) || null;
        sortEntriesByDay(month);
      } else {
        entry[field] = input.value;
      }

      recalculateAll();
      saveData();
      render();
    }

    function handleDayPickerOpen(event) {
      const input = event.currentTarget;
      if (typeof input.showPicker !== "function") return;
      try {
        input.showPicker();
      } catch (error) {
        /* calendário já aberto ou bloqueado pelo navegador */
      }
    }

    function sortEntriesByDay(month) {
      month.entries.sort((a, b) => {
        const dayA = Number(a.dayNumber) || Infinity;
        const dayB = Number(b.dayNumber) || Infinity;
        return dayA - dayB;
      });
    }

    function addEntry() {
      const month = months[selectedIndex];
      const monthNumber = MONTH_NUMBERS[month.name] || 1;
      const totalDays = new Date(YEAR, monthNumber, 0).getDate();
      const maxDay = month.entries.reduce((max, entry) => Math.max(max, Number(entry.dayNumber) || 0), 0);
      const nextDay = month.entries.length ? Math.min(maxDay + 1, totalDays) : 1;
      const newEntry = { day: String(nextDay), dayNumber: nextDay, hours: 0, task: "", tags: [] };
      month.entries.push(newEntry);
      sortEntriesByDay(month);
      recalculateAll();
      saveData();
      render();
      const newIndex = month.entries.indexOf(newEntry);
      window.requestAnimationFrame(() => {
        const input = document.querySelector(`.tag-input[data-index="${newIndex}"]`);
        if (!input) return;
        input.scrollIntoView({ block: "nearest" });
        input.focus();
      });
    }

    function handleHourStep(event) {
      const button = event.currentTarget;
      const month = months[selectedIndex];
      const entry = month.entries[Number(button.dataset.index)];
      if (!entry) return;
      const direction = Number(button.dataset.direction || 0);
      entry.hours = Math.max(0, Number((Number(entry.hours || 0) + direction * 0.5).toFixed(1)));
      recalculateAll();
      saveData();
      render();
    }

    function isPendingEntry(entry) {
      normalizeEntryTags(entry);
      return entry.tags.length === 0;
    }

    function collectTagSuggestions() {
      const suggestions = new Map();
      months.forEach((month) => {
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          entry.tags.forEach((tag) => {
            const cleanTag = tag.trim();
            if (!cleanTag) return;
            suggestions.set(cleanTag.toLowerCase(), cleanTag);
          });
        });
      });
      return Array.from(suggestions.values()).sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function renderTagSuggestions() {
      const datalist = document.getElementById("tagSuggestions");
      if (!datalist) return;
      datalist.innerHTML = collectTagSuggestions()
        .map((tag) => `<option value="${escapeHtml(tag)}"></option>`)
        .join("");
    }

    function commitTag(index, value) {
      const tag = String(value || "").trim();
      if (!tag) return false;
      const entry = months[selectedIndex].entries[index];
      if (!entry) return false;
      normalizeEntryTags(entry);
      entry.tags.push(tag);
      entry.task = entry.tags.join(" / ");
      recalculateAll();
      saveData();
      return true;
    }

    function handleTagKeydown(event) {
      if (event.key !== "Tab" && event.key !== "Enter") return;
      event.preventDefault();
      const index = Number(event.currentTarget.dataset.index);
      if (!commitTag(index, event.currentTarget.value)) return;
      render();
      focusTagInput(index);
    }

    function handleTagAdd(event) {
      const index = Number(event.currentTarget.dataset.index);
      const input = document.querySelector(`.tag-input[data-index="${index}"]`);
      if (!commitTag(index, input ? input.value : "")) return;
      render();
      focusTagInput(index);
    }

    function focusTagInput(index) {
      window.requestAnimationFrame(() => {
        const input = document.querySelector(`.tag-input[data-index="${index}"]`);
        if (!input) return;
        input.focus();
        input.value = "";
      });
    }

    function exportSelectedMonth() {
      const month = months[selectedIndex];
      const report = buildMonthlyReport(month);
      const reportWindow = window.open("", "_blank");
      if (!reportWindow) return;
      reportWindow.document.open();
      reportWindow.document.write(report);
      reportWindow.document.close();
      reportWindow.focus();
      reportWindow.addEventListener("load", () => {
        reportWindow.print();
      }, { once: true });
    }

    function buildMonthlyReport(month) {

      const balanceText = month.balance < 0 ? `+${fmtHours(Math.abs(month.balance))}` : fmtHours(month.balance);
      return `<!doctype html>

<body>
  <main class="page">

    }

    function getTopActivities(month) {
      const totals = new Map();
      month.entries.forEach((entry) => {
        normalizeEntryTags(entry);
        const tags = entry.tags.length ? entry.tags : ["Sem atividade"];
        const share = Number(entry.hours || 0) / tags.length;
        tags.forEach((tag) => {
          totals.set(tag, Number(((totals.get(tag) || 0) + share).toFixed(2)));
        });
      });
      return Array.from(totals, ([tag, hours]) => ({ tag, hours }))
        .filter((item) => item.hours > 0)
        .sort((a, b) => b.hours - a.hours)
        .slice(0, 2);
    }

    function handleTagRemove(event) {
      const index = Number(event.currentTarget.dataset.index);
      const tagIndex = Number(event.currentTarget.dataset.tagIndex);
      const entry = months[selectedIndex].entries[index];
      if (!entry) return;
      normalizeEntryTags(entry);
      entry.tags.splice(tagIndex, 1);
      entry.task = entry.tags.join(" / ");
      recalculateAll();
      saveData();
      render();
    }

    function renderSearchResults() {
      const input = document.getElementById("activitySearch");
      const results = document.getElementById("activitySearchResults");
      if (!input || !results) return;
      const query = input.value.trim().toLowerCase();
      if (!query) {
        results.innerHTML = "";
        return;
      }

      const matches = [];
      months.forEach((month) => {
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          entry.tags.forEach((tag) => {
            if (tag.toLowerCase().includes(query)) {
              matches.push({ month: month.name, day: entry.day, hours: entry.hours, tag });
            }
          });
        });
      });

      results.innerHTML = matches.length
        ? matches.slice(0, 24).map((match) => `
          <span class="search-result"><strong>${match.month} ${escapeHtml(match.day)}</strong>${escapeHtml(match.tag)} · ${fmtHours(match.hours)}</span>
        `).join("")
        : "";
    }

    function setupCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    initControls();
    render();
    loadCloudData()
      .then((remoteData) => {
        if (applyCloudData(remoteData)) render();
        else if (EDIT_MODE) queueCloudSave();
      })
      .catch((error) => {
        console.warn("Usando dados locais enquanto a base online não responde.", error);
      });
    window.addEventListener("resize", render);
  </script>
</body>
</html>
