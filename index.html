    }

    function getActivityTypes(month) {
      const FIXED = { __ve: "Vídeo/Edição" };
      function catKey(firstWord) {
        const n = normTag(firstWord);
        if (/^edic/.test(n) || /^video/.test(n)) return "__ve";
        return n.replace(/(oes|aes|es|s)$/i, "");
      }
      const totals = new Map();
      month.entries.forEach((entry) => {
        normalizeEntryTags(entry);
        const tags = entry.tags.filter((tag) => !isNonWorkTag(tag));
        if (!tags.length) return;
        const share = Number(entry.hours || 0) / tags.length;
        tags.forEach((tag) => {
          const firstWord = String(tag).trim().split(/\s+/)[0] || "";
          if (!firstWord) return;
          const key = catKey(firstWord);
          if (!key) return;
          let rec = totals.get(key);
          if (!rec) { rec = { hours: 0, labels: new Map() }; totals.set(key, rec); }
          rec.hours += share;
          rec.labels.set(firstWord, (rec.labels.get(firstWord) || 0) + 1);
        });
      });
      const out = [];
      totals.forEach((rec, key) => {
        if (rec.hours <= 0) return;
        let label = FIXED[key];
        if (!label) {
          let bestLabel = "", bestCount = -1;
          rec.labels.forEach((cnt, lbl) => { if (cnt > bestCount) { bestCount = cnt; bestLabel = lbl; } });
          label = bestLabel.charAt(0).toUpperCase() + bestLabel.slice(1).toLowerCase();
        }
        out.push({ label, hours: rec.hours });
      });
      return out.sort((a, b) => b.hours - a.hours).slice(0, 4)
        .map((item) => ({ label: item.label, hours: Math.round(item.hours * 2) / 2 }));
    }

    function isNonWorkTag(tag) {
      return /^(sem atividade|feriad|feria|folga)/.test(normTag(tag));
    }

    function getTopActivities(month) {
      const totals = new Map();
      month.entries.forEach((entry) => {
        normalizeEntryTags(entry);
        const tags = entry.tags.filter((tag) => !isNonWorkTag(tag));
        if (!tags.length) return;
        const share = Number(entry.hours || 0) / tags.length;
        tags.forEach((tag) => {
          totals.set(tag, (totals.get(tag) || 0) + share);
        });
      });
      return Array.from(totals, ([tag, hours]) => ({ tag, hours }))
        .filter((item) => item.hours > 0.01)
        .sort((a, b) => b.hours - a.hours)
        .slice(0, 2)
        .map((item) => ({ tag: item.tag, hours: Math.round(item.hours * 2) / 2 }));
    }

    function handleTagRemove(event) {
      const index = Number(event.currentTarget.dataset.index);
      const tagIndex = Number(event.currentTarget.dataset.tagIndex);
      const entry = months[selectedIndex].entries[index];
      if (!entry) return;
      normalizeEntryTags(entry);
      entry.tags.splice(tagIndex, 1);
      entry.task = entry.tags.join(" / ");
      recalculateAll();
      saveData();
      render();
    }

    function renderSearchResults() {
      const input = document.getElementById("activitySearch");
      const results = document.getElementById("activitySearchResults");
      if (!input || !results) return;
      const query = input.value.trim().toLowerCase();
      if (!query) {
        results.innerHTML = "";
        return;
      }

      const matches = [];
      months.forEach((month) => {
        month.entries.forEach((entry) => {
          normalizeEntryTags(entry);
          entry.tags.forEach((tag) => {
            if (tag.toLowerCase().includes(query)) {
              matches.push({ month: month.name, day: entry.day, hours: entry.hours, tag });
            }
          });
        });
      });

      results.innerHTML = matches.length
        ? matches.slice(0, 24).map((match) => `
          <span class="search-result"><strong>${match.month} ${escapeHtml(match.day)}</strong>${escapeHtml(match.tag)} · ${fmtHours(match.hours)}</span>
        `).join("")
        : "";
    }

    function setupCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    initControls();
    render();
    loadCloudData()
      .then((remoteData) => {
        if (applyCloudData(remoteData)) render();
        else if (EDIT_MODE) queueCloudSave();
      })
      .catch((error) => {
        console.warn("Usando dados locais enquanto a base online não responde.", error);
      });
    window.addEventListener("resize", render);
  </script>
